contract:
  id: C02
  name: Data Provenance & Dataset Snapshot
  former_name: DatasetSnapshot
  contract_version: "1.1"
  supersedes: "1.0"
  compatibility: backward-compatible (additive) — see section `compatibility`
  status: "inspected (HAT #5 PASS) — C02 v1.1 remains OPEN pending human acceptance"
  protocol: QDP-v0.1
  decision_record: docs/adr/DR-004-c02-data-provenance-architecture.md
  resolves: [DATA-GAP-01, DATA-GAP-02]  # research/I01/DATA-REQ-I01.md §7.3

revisions:
  - {revision: initial, commit: bd088e2, validation: docs/validation/C02-v1.1-validation-report.md}
  - revision: CA-01
    trigger: "docs/validation/C02-v1.1-HAT.md (HAT #1 FAIL, 3c684b7)"
    changes:
      - C02-INV-05 précisé (immuabilité transitive, périmètre de la garantie)
      - C02-INV-18 reformulé sur la règle CRED-1 (garantie réelle et limites)
      - compatibility.behaviour_changes déclarés (BC-01…BC-07)
    report: docs/validation/C02-v1.1-CA-01-report.md
  - revision: CA-02
    trigger: "docs/validation/C02-v1.1-HAT-2.md (HAT #2 FAIL, 21f3dcd)"
    changes:
      - CRED-1 redéfini comme grammaire indépendante de la position (V1–V4) ; limites et faux positifs déclarés
      - C02-INV-09 précisé (collection fournie à identifiants distincts ; vérification invariante par permutation)
      - QCJ-1 / QCT-1 / QCC-1 — domaine explicite (années 0001–9999, précision décimale, heure locale à la seconde)
      - C02-INV-05 et limitations — objets validés vs objets forgés ; frontières validantes (validation_boundaries)
      - frontière de garantie de chaque invariant (invariant_enforcement), dont C02-INV-14
      - BC-03, BC-06, BC-07 corrigés ; BC-08 à BC-11 déclarés
    report: docs/validation/C02-v1.1-CA-02-report.md
  - revision: CA-03
    trigger: "docs/validation/C02-v1.1-HAT-3.md (HAT #3 FAIL, cf63d57)"
    changes:
      - "frontière temporelle unique : tout datetime aware validé est stocké en UTC canonique (A1, A2)"
      - Knowable.value gelé en profondeur (A3)
      - verify_artifacts agrège et trie les erreurs de revalidation (A4)
      - CRED-1 refondu en scanner à règles séparées ; V1–V4 aussi sur les clés ; V2 chevauchant ; V4 dernier @ (A5–A7, M3, M4)
      - INV-10 précisé (unicité dans l'univers de la lignée) (M5)
      - "BC-12 à BC-14 : UTC, clés homonymes v1.1, bool/int stricts (M6, M9)"
      - domaine UTF-8 à la validation (M7) ; INV-05 borné à l'état scientifique (M8)
      - R1/R2 corrigés (ValueError / rapport de profil) ; BC-11 rendu factuel
    report: docs/validation/C02-v1.1-CA-03-report.md
  - revision: CA-04
    trigger: "docs/validation/C02-v1.1-HAT-4.md (HAT #4 FAIL, 2aff2b0)"
    changes:
      - "Knowable[T] n'est pas plus permissif que T : type brut int/bool contrôlé avant coercition Pydantic (B1, BC-14 transitif)"
      - FrozenMap / Knowable.known(mapping) sérialisables par model_dump / JSON officiel (M1)
      - "TransformationRecord.parameters : objet QCJ-1 récursif (mappings imbriqués) (M2)"
    report: docs/validation/C02-v1.1-CA-04-report.md

description: >
  Provenance vérifiable des données scientifiques : de l'artefact brut effectivement reçu
  d'une source externe jusqu'au snapshot immuable consommé par une expérience, en passant
  par des transformations ordonnées et un calendrier de séances matérialisé.
  Ne prescrit ni format de stockage, ni source externe, ni source de calendrier.

provenance_chain: |
  ProviderArtifact ──► TransformationRecord* ──► DatasetSnapshot ◄── MarketCalendarSnapshot
                                                      │
                                                      └──► DataGateAssessment (évalué après figement)

# =====================================================================================
# 1. Types communs
# =====================================================================================

Knowable:
  description: >
    Métadonnée à connaissance partielle. Type générique unique pour toute information
    fournisseur ou externe susceptible d'être inconnue. Aucune convention ad hoc par champ.
    value (status=KNOWN) est gelée en profondeur (listes→tuples, mappings→FrozenMap).
    Knowable[T] ne rend pas plus permissive la politique de validation définie pour T.
    Pour T = int et T = bool, le type brut d'entrée est examiné avant toute conversion
    Pydantic (type(x) is int / type(x) is bool ; un bool n'est pas un int scientifique).
    Les coercitions JSON déjà normatives de T (str→date, str→enum, dict→modèle, list→tuple)
    restent celles de T. Un mapping KNOWN est sérialisé en objet JSON (model_dump / JSON).
  fields:
    status: {type: enum, values: [KNOWN, UNKNOWN, NOT_APPLICABLE]}
    value: {type: T, description: "présent si et seulement si status = KNOWN"}
    note: {type: string, optional: true, description: "raison, référence de preuve"}
  invariant: C02-INV-K01

Fingerprint:
  format: "sha256:<64 caractères hexadécimaux minuscules>"
  algorithm: SHA-256 sur les octets de la représentation canonique déclarée
  scope_rule: >
    Toute empreinte déclare sa représentation (QCJ-1, QCT-1, QCC-1 ou octets bruts).
    Les métadonnées d'exécution (horodatages) n'entrent dans aucune empreinte d'identité.

# =====================================================================================
# 2. Représentations canoniques (normatives — REP-04)
# =====================================================================================

canonical_representations:
  QCJ-1:
    usage: objets d'identité (paramètres, lignée, agrégat brut, identité de calendrier)
    rules:
      - encodage UTF-8 sans BOM ; aucune normalisation Unicode appliquée (chaînes hachées telles quelles) ;
        une chaîne non encodable en UTF-8 (surrogate isolé, etc.) est rejetée à la validation et par QCJ-1
      - JSON (RFC 8259) sans espace non significatif ; séparateurs "," et ":"
      - clés d'objet triées par point de code Unicode croissant ; clés uniquement de type chaîne
      - caractères non ASCII émis tels quels (pas d'échappement \uXXXX)
      - entiers en décimal, |n| <= 2^53 - 1
      - nombres non entiers INTERDITS (les encoder en chaîne décimale explicite)
      - NaN et ±Infinity interdits
      - booléens true/false ; null autorisé
      - "date → YYYY-MM-DD ; année toujours sur 4 chiffres (domaine 0001–9999)"
      - "instant → UTC YYYY-MM-DDTHH:MM:SS.ffffffZ (6 décimales toujours, année sur 4 chiffres) ; instant naïf
        interdit ; instant dont la conversion UTC sort de 0001-01-01..9999-12-31 interdit"
      - "heure locale → HH:MM:SS ; heure avec fuseau interdite ; heure à fraction de seconde non nulle interdite
        (non représentable, collision d'identité)"
      - "listes : ordre conservé (l'ordre fait partie du contenu)"
  QCT-1:
    usage: table scientifique canonique d'un DatasetSnapshot (fingerprint)
    rules:
      - encodage UTF-8 sans BOM
      - "première ligne = en-tête : noms de colonnes dans l'ordre déclaré par TableSchema.columns"
      - une ligne par enregistrement ; séparateur de champ "," ; aucun guillemet
      - fin de ligne "\n" (LF) après chaque ligne, y compris la dernière ; pas de CR
      - "ordre des lignes : croissant selon TableSchema.primary_key, comparaison sur valeurs typées
        (date/instant chronologique en UTC, entier numérique, chaîne par point de code) ; clés dupliquées interdites"
      - date → "YYYY-MM-DD" ; instant → format QCJ-1
      - decimal → notation positionnelle à échelle fixe TableSchema.columns[].scale ; séparateur ".",
        sans exposant, sans séparateur de milliers, "-" pour les négatifs, jamais "+" ;
        arrondi au pair le plus proche (ROUND_HALF_EVEN) appliqué à la valeur EXACTE de l'entrée
        (valeur binaire exacte pour un flottant) ; zéro négatif normalisé en zéro positif ;
        domaine — résultat d'au plus 28 chiffres significatifs (partie entière + scale), sinon rejet ;
        calcul dans un contexte décimal explicite, indépendant du contexte global du processus
      - "colonnes du schéma : noms uniques ; chaque cellule est validée (type, nullabilité) avant le tri"
      - integer → décimal sans zéro non significatif ; booléen interdit
      - string → caractères ',' '"' CR LF interdits
      - valeur manquante → champ vide, autorisé uniquement si la colonne est nullable
      - NaN / ±Infinity interdits
      - colonnes hors schéma interdites
  QCC-1:
    usage: liste des séances d'un MarketCalendarSnapshot (sessions_fingerprint)
    rules:
      - une date "YYYY-MM-DD" (année sur 4 chiffres) par ligne, strictement croissante, sans doublon
      - '"\n" après chaque date, y compris la dernière ; UTF-8 ; liste vide interdite'

credential_rules:
  CRED-1:
    usage: détection d'indicateurs structurels de secret (C02-INV-18)
    scope:
      - ProviderArtifact.request_parameters — clés et valeurs, récursivement
      - ProviderArtifact.provenance_metadata — clés et valeurs
      - ProviderArtifact.provider_interface — valeur
      - TransformationRecord.parameters — clés et valeurs, récursivement (éléments de liste compris)
    grammar: >
      Scanner déterministe à règles séparées (K1, V1, V2, V3, V4). Chaque indicateur V est une
      propriété lexicale de la chaîne, détectée quelle que soit sa position et la casse des mots-clés.
      K1 s'applique aux clés. V1–V4 s'appliquent aux clés et aux valeurs (une clé peut elle-même
      porter un userinfo, un schéma d'authentification ou un en-tête). Les listes et mappings
      imbriqués sont parcourus récursivement. Une chaîne est rejetée dès qu'un indicateur y figure.
    indicators:
      K1: "nom de clé contenant token, api_key/apikey/api-key, secret, password/passwd, authorization,
           bearer, credential, private_key/privatekey/private-key, access_key/accesskey/access-key
           (sous-chaîne, insensible à la casse)"
      V1: "sous-chaîne « authorization » suivie (espaces admis) de « : » ou « = », à toute position"
      V2: "chaque mot de schéma bearer | basic | digest | token (non adjacent à une lettre ou un chiffre)
           est examiné indépendamment : un mot précédent ne consomme pas le suivant. Suivi d'espaces et
           d'un jeton [A-Za-z0-9-._~+/]+=* ; forme identifiant = au moins 8 caractères après retrait de
           la ponctuation finale y compris le padding « = », et pas un mot naturel (lettres seules,
           majuscule initiale au plus)"
      V3: "paramètre « nom= » (espaces admis avant =), nom = suite maximale [lettres, chiffres, _ . -],
           dont le nom satisfait K1 ; après ? & ; ou #, aussi key, auth, sig, signature et suffixe de
           segment sig/signature"
      V4: "userinfo URI avec mot de passe : après scheme://, le dernier « @ » avant « / ? # » ou espace
           termine le userinfo ; « : » dans ce userinfo = mot de passe (utilisateur pouvant contenir « @ »
           ou un encodage pourcent)"
    limits: >
      CRED-1 n'est PAS un détecteur universel de secrets. Ne sont pas détectés : un secret brut sans
      marqueur structurel, un secret encodé, fragmenté ou obfusqué (y compris par caractères Unicode
      visuellement équivalents), un secret hors périmètre. Frontière lexicale de V2 (faux négatifs
      déclarés) : jeton de moins de 8 caractères (« Bearer abc »), jeton mot naturel (« Bearer abcdefghij »),
      schéma collé à une lettre (« xBearer … ») ; ces formes restent détectées par V1 derrière
      Authorization. Faux négatif déclaré de V4 : userinfo sans « : » (ssh://git@host). Hors frontière
      (non signalés) : « Basic Materials », « Basic Materials=12% », « the basic settings=5 »,
      « Token Ring », « bearer bond », « authorization_status: ok », « sort key=… » hors URL.
      Faux positifs déclarés (rejetés) : K1 sur toute clé contenant un mot d'identification
      (« tokenizer », « privatekey ») ; V1 sur « preauthorization: » ; V2 sur « Basic 20221231 » ;
      V3 sur « token=3 ». L'obligation première reste de ne jamais transmettre de secret à ces champs.

test_vectors:
  # Deux implémentations conformes DOIVENT reproduire ces octets et ces empreintes.
  QCT-1:
    schema:
      columns:
        - {name: session_date, type: date}
        - {name: adjusted_close, type: decimal, scale: 6}
        - {name: close, type: decimal, scale: 4, nullable: true}
      primary_key: [session_date]
    rows_input_order:
      - {session_date: "2020-01-03", adjusted_close: "101.5", close: null}
      - {session_date: "2020-01-02", adjusted_close: "100.1234565", close: 100}
    bytes: "session_date,adjusted_close,close\n2020-01-02,100.123456,100.0000\n2020-01-03,101.500000,\n"
    fingerprint: "sha256:c815b68ff3ed0ee548e79700e2a9651b3365e0e79cb1ae5202151182469771d0"
  QCC-1:
    sessions: ["2020-01-02", "2020-01-03", "2020-01-06"]
    bytes: "2020-01-02\n2020-01-03\n2020-01-06\n"
    fingerprint: "sha256:e481bd671c59e4d9b6da6f0a0ff7db42b2cbf70aae3bb6b24706ffd56fcf09c5"
  QCJ-1:
    input: {t: "2020-01-02T16:00:00-05:00", d: "2020-01-02 (date)", b: "é", a: [1, true, null]}
    bytes_utf8: '{"a":[1,true,null],"b":"é","d":"2020-01-02","t":"2020-01-02T21:00:00.000000Z"}'
    fingerprint: "sha256:4ad22465ed2282ab01f2f58a2ba885f36d8477f5a74bc0c38328b72c019b6828"

# =====================================================================================
# 3. Périmètre des empreintes
# =====================================================================================

fingerprint_scope:
  ProviderArtifact.content_sha256:
    covers: octets exacts reçus de la source
    excludes: [acquired_at, provenance_metadata, license, request_parameters]
  TransformationRecord.application_key:
    representation: QCJ-1
    covers: [transformation_id, transformation_type, implementation_version, parameters, input_fingerprints]
    excludes: [executed_at, observations_*, justification, output_fingerprint]
  DatasetSnapshot.lineage_fingerprint:
    representation: QCJ-1 de {"kind":"C02.lineage","steps":[{step_index, application identity, output_fingerprint}]}
    excludes: [executed_at, observations_*, justification]
  DatasetSnapshot.raw_fingerprint:
    representation: >
      QCJ-1 de {"kind":"C02.raw_artifact_set","members":[content_sha256 triés lexicographiquement]}
    semantics: >
      Sémantique d'ENSEMBLE (indépendante de l'ordre de consommation, qui est porté par la lignée).
      Enveloppé même pour un seul artefact : raw_fingerprint ≠ content_sha256 par construction.
      Doublons et ensemble vide interdits.
  DatasetSnapshot.fingerprint:
    representation: QCT-1 de la table canonique (lorsque table_schema est présent)
    excludes: [as_of, métadonnées du snapshot, lignée, calendrier]
  MarketCalendarSnapshot.sessions_fingerprint:
    representation: QCC-1
  MarketCalendarSnapshot.content_fingerprint:
    representation: >
      QCJ-1 de {"kind":"C02.market_calendar","canonical_representation","market","timezone",
      "regular_close_local","early_closes" (triées par séance),"sessions_fingerprint"}
    excludes: [calendar_snapshot_id, source, source_version, generated_at]
    rationale: deux sources produisant exactement le même contenu ont la même identité scientifique

# =====================================================================================
# 4. Objets
# =====================================================================================

objects:

  ProviderArtifact:
    description: Artefact brut effectivement reçu d'une source externe, avant interprétation.
    fields:
      required:
        - artifact_id
        - provider_id
        - provider_product
        - provider_interface            # endpoint / interface logique
        - provider_interface_version    # Knowable[string] — UNKNOWN admis, jamais inventé
        - instrument                    # InstrumentIdentifiers
        - requested_first_session       # Knowable[date]
        - requested_last_session        # Knowable[date]
        - acquired_at                   # instant UTC — métadonnée d'exécution
        - content_sha256
        - media_type
        - encoding                      # Knowable[string] ; NOT_APPLICABLE pour un format binaire
        - byte_size
        - license                       # LicenseRef
      optional:
        - request_parameters            # objet QCJ-1 de scalaires
        - provenance_metadata           # objet chaîne → chaîne (en-têtes, marqueurs de révision)
    rules:
      - aucun indicateur CRED-1 dans request_parameters, provenance_metadata ni provider_interface
      - requested_first_session <= requested_last_session si les deux sont connus

  InstrumentIdentifiers:
    fields: [ticker, venue, isin, cusip, figi, vendor_permanent_id]
    types: "ticker: string ; autres: Knowable[string]"

  LicenseRef:
    description: >
      Transport de la licence d'un artefact. `usage_basis_ref` RÉFÉRENCE la décision qui fonde
      l'usage (ex. « DR-003 ASSUMPTION A-1 ») ; C02 n'est pas une source normative de cette hypothèse.
    fields:
      - license_id
      - terms_ref
      - terms_version            # Knowable[string]
      - plan_tier                # Knowable[string]
      - usage_basis_ref          # Knowable[string]
      - raw_retention_permitted  # Knowable[bool] — REP-05
      - retention_condition      # Knowable[string] (ex. « jusqu'à la fin de l'abonnement »)

  ProviderArtifactRef:
    fields: [artifact_id, content_sha256, license]
    rule: égal champ à champ à ProviderArtifact.ref() de l'artefact référencé

  TransformationRecord:
    description: Étape déterministe entre artefact(s) brut(s) et table scientifique.
    fields:
      required:
        - step_index               # 0…n-1, ordre d'exécution
        - transformation_id
        - transformation_type      # vocabulaire ouvert : PARSE, DATE_NORMALIZATION, SORT, DEDUPLICATION,
                                   # COLUMN_SELECTION, CALENDAR_ALIGNMENT, QUALITY_FILTER, …
        - implementation_version
        - parameters               # objet QCJ-1 (scalaires, listes et objets imbriqués)
        - input_fingerprints       # liste ordonnée non vide
        - output_fingerprint
        - executed_at              # instant UTC — métadonnée d'exécution
        - observations_in          # Knowable[int]
        - observations_out         # Knowable[int]
        - observations_dropped     # Knowable[int]
      optional:
        - justification

  MarketCalendarSnapshot:
    description: Calendrier de séances matérialisé ; une chaîne « NYSE » n'est pas une identité.
    fields:
      required:
        - calendar_snapshot_id
        - market
        - timezone                 # IANA
        - source                   # Knowable[string]
        - source_version           # Knowable[string]
        - generated_at             # métadonnée
        - regular_close_local      # heure locale naïve
        - sessions                 # liste matérialisée, QCC-1
        - first_session
        - last_session
        - session_count
        - canonical_representation # "QCC-1"
        - sessions_fingerprint
        - content_fingerprint
      optional:
        - early_closes             # [{session, close_local}]
    operations:
      rank(session): rang 0-indexé (CAL-04) ; erreur si la date n'est pas une séance
      sessions_between(first, last): nombre de séances, bornes incluses
      close_instant(session): instant de clôture officielle (clôture anticipée comprise)
    non_goals: >
      Le contrat ne choisit aucune source réelle de calendrier et n'en fabrique aucune.
      Le choix de la source est une décision distincte (DR-003 DEF-04).

  MarketCalendarRef:
    fields: [calendar_snapshot_id, content_fingerprint]

  DatasetSnapshot:
    description: Objet scientifique immuable consommé par les expériences.
    fields:
      required:              # inchangés depuis v1.0
        - snapshot_id
        - fingerprint
        - as_of
        - provenance
        - availability_cutoff
        - contract_version     # "1.0" ou "1.1"
      optional_v1_0:
        - instruments
        - adjustments
        - quality_flags
        - storage_hint
      optional_v1_1:
        - table_schema          # TableSchema (schema_id, schema_version, QCT-1, columns, primary_key)
        - source_artifacts      # [ProviderArtifactRef]
        - raw_fingerprint       # requis si source_artifacts non vide
        - lineage               # [TransformationRecord]
        - market_calendar       # MarketCalendarRef
        - temporal_convention   # {source_timezone: Knowable, canonical_timezone, session_date_rule}
        - requested_range       # Knowable[SessionRange]
        - returned_range        # SessionRange — bornes effectivement retournées par la source
        - canonical_range       # SessionRange — bornes de la table canonique
        - counts                # {raw_observations, canonical_observations, expected_sessions,
                                #  missing_sessions, invalidated_sessions}
        - adjustment_methodology  # {events_covered, method, reference_date, dividend_factor_formula,
                                  #  methodology_ref, methodology_version, numeric_precision, currency}
        - instrument            # InstrumentIdentifiers
        - intended_use          # usage déclaré AVANT l'évaluation du gate DATA
    field_definitions:
      fingerprint: >
        Empreinte du contenu. Si table_schema est présent : SHA-256 de la représentation QCT-1
        de la table canonique, format sha256:<hex> obligatoire. Pour un objet sans table_schema,
        la sémantique v1.0 est conservée (format non imposé rétroactivement).
      as_of: instant de figement ISO 8601 UTC
      availability_cutoff: >
        Dernier instant d'information incluse — borne anti look-ahead.
        DOIT vérifier availability_cutoff <= as_of (voir errata E-01).
      licence: >
        Portée par chaque ProviderArtifactRef.license (le snapshot est dérivé de ses artefacts).

  DataGateAssessment:
    description: >
      Verdict de qualité évalué sur un snapshot déjà figé. Objet distinct : l'inscrire dans le
      snapshot violerait son immuabilité (REV-D-02).
    fields: [assessment_id, snapshot_ref, evaluated_against, evaluated_at, intended_use,
             coverage_tier, checks, verdict]
    checks_item: "{check_id, outcome: [PASS, WARN, INCONCLUSIVE, REJECT], measurement?, detail?}"
    verdict: [PASS, FAIL, INCONCLUSIVE]

# =====================================================================================
# 5. Préconditions, postconditions, invariants
# =====================================================================================

preconditions:
  - availability_cutoff <= as_of is REQUIRED; availability_cutoff > as_of → reject (errata E-01)
  - time_range_start < time_range_end
  - contract_version ∈ {"1.0", "1.1"}

postconditions:
  - snapshot immutable after publish; mutation requires new snapshot_id (REV-D-02)
  - le fingerprint est vérifié au chargement ; tout écart interrompt le run

invariants:
  C02-INV-01: availability_cutoff <= as_of (errata E-01)
  C02-INV-02: availability_cutoff bounds all downstream MarketState.as_of values (C03)
  C02-INV-03: fingerprint uniqueness enforced within experiment registry
  C02-INV-04: provenance.survivorship_bias_acknowledged is an explicit boolean
  C02-INV-05: >-
              immuabilité de l'état scientifique — après validation, aucune action autorisée sur les
              références accessibles ne peut modifier l'état scientifique, la sérialisation canonique
              (QCJ-1 / QCT-1 / QCC-1 / model_dump_json de référence) ni l'identité C02 (empreintes).
              Conteneurs atteignables gelés (tuples, FrozenMap, Knowable.value gelé en profondeur) ;
              instants stockés en UTC (tzinfo de l'appelant non conservé). Hors garantie : les
              contournements délibérés (object.__setattr__, attributs privés) ; les objets FORGÉS
              (model_construct, model_copy(update=…)) tant qu'ils n'ont franchi aucune frontière
              validante ; la métadonnée interne Pydantic model_fields_set / __pydantic_fields_set__
              (mutable, peut affecter model_dump(exclude_unset=True), pas l'identité ni le JSON de
              référence)
  C02-INV-K01: Knowable — value présent ⇔ status = KNOWN
  C02-INV-06: représentations canoniques déterministes (QCJ-1, QCT-1, QCC-1) ; vecteurs de test reproduits
  C02-INV-07: table_schema présent ⇒ fingerprint = sha256(QCT-1(table)) au format sha256:<hex>
  C02-INV-08: source_artifacts non vide ⇔ raw_fingerprint présent ; raw_fingerprint = agrégat d'ensemble
  C02-INV-09: >-
              artefacts référencés uniques (id et empreinte) ; références = artefacts (id, empreinte,
              licence). La collection d'artefacts fournie à la vérification doit avoir des artifact_id deux à
              deux distincts (∀ i ≠ j, id_i ≠ id_j), sinon rejet déterministe ; le résultat de la vérification
              (succès ou message) est invariant par permutation de la collection
  C02-INV-10: lignée — step_index 0…n-1 ; chaque entrée = artefact source, sortie antérieure ou dépendance
              auxiliaire déclarée (empreinte du calendrier référencé) ; chaque artefact source consommé ;
              sorties uniques dans l'univers de la lignée (sources, auxiliaires, sorties antérieures) et
              distinctes de leurs entrées ; sortie finale = fingerprint
  C02-INV-11: déterminisme — même application_key ⇒ même output_fingerprint
  C02-INV-12: horodatages d'exécution exclus de toute identité (acquired_at, executed_at, generated_at,
              evaluated_at, as_of pour la table)
  C02-INV-13: calendrier — séances strictement croissantes ; first/last/count cohérents ; empreintes
              recalculées ; clôtures anticipées ⊂ séances et antérieures à la clôture régulière
  C02-INV-14: référence calendrier valide — ref égale ; bornes canoniques = séances ; expected_sessions =
              séances du calendrier dans canonical_range ; canonical_timezone = fuseau du calendrier
  C02-INV-15: comptages — canonical <= raw ; canonical + missing = expected (si connus) ; valeurs >= 0 ;
              observations_out = observations_in − observations_dropped (si connus)
  C02-INV-16: canonical_range ⊆ returned_range
  C02-INV-17: objet déclaré "1.0" ⇒ aucun champ v1.1 renseigné
  C02-INV-18: >-
              aucun indicateur structurel de secret (règle CRED-1, indicateurs K1, V1–V4) dans les champs
              du périmètre CRED-1 ; garantie limitée aux indicateurs définis (voir CRED-1.limits)
  C02-INV-19: DataGateAssessment — REJECT ⇒ FAIL ; INCONCLUSIVE ⇒ pas PASS ; check_id uniques

validation_boundaries:
  decision: >
    Toute frontière validante revalide PROFONDÉMENT les instances reçues (y compris imbriquées),
    qu'elles aient été construites normalement ou forgées. Un objet forgé ne peut donc pas contaminer
    un objet racine validé ni un rapport de profil ; il reste lui-même hors garantie tant qu'il n'a
    franchi aucune frontière. Les instances imbriquées sont stockées comme copies revalidées (BC-09).
  boundaries:
    - constructeur et model_validate / model_validate_json de tout modèle C02
    - DatasetSnapshot.verify_artifacts (artefacts fournis)
    - DatasetSnapshot.verify_calendar (calendrier fourni)
    - profiles.i01.validate_i01_snapshot (snapshot, évaluation ; calendrier et artefacts via verify_*)
  bypass_apis: [model_construct, "model_copy(update=…)", object.__setattr__, attributs privés ou spéciaux]
  not_boundaries: >
    Les méthodes appelées sur un objet forgé lui-même (ex. forged.ref(), forged.verify_calendar(…))
    opèrent sur un état non validé : hors garantie.

invariant_enforcement:
  construction: >
    Vérifiés à toute frontière validante : C02-INV-01, INV-04 (type), INV-05, INV-K01, INV-07 (format
    de l'empreinte), INV-08, INV-09 (unicité des références), INV-10, INV-13, INV-15, INV-16, INV-17,
    INV-18, INV-19. INV-06 et INV-12 sont des propriétés des représentations canoniques (vecteurs de
    test, exclusion des horodatages par construction des identités).
  verification_functions:
    C02-INV-07: DatasetSnapshot.verify_table(rows) — égalité de l'empreinte QCT-1 (la table n'est pas portée par le snapshot)
    C02-INV-09: DatasetSnapshot.verify_artifacts(artifacts) — correspondance références = artefacts fournis
    C02-INV-11: lineage.assert_deterministic(records) — entre lignées ou exécutions
    C02-INV-14: >
      DatasetSnapshot.verify_calendar(calendar) — le snapshot ne porte qu'une référence au calendrier ;
      l'invariant n'est PAS vérifié à la construction du snapshot. Clauses conditionnelles : bornes
      vérifiées si canonical_range est présent, comptage si expected_sessions est KNOWN, fuseau si
      temporal_convention est présent. Le profil C02-I01 appelle verify_calendar et exige ces champs
      (présents / KNOWN), ce qui rend l'invariant complet pour I01.
  external:
    C02-INV-02: vérifié par C03 (MarketState.as_of <= availability_cutoff)
    C02-INV-03: registre d'expériences — non implémenté (DR-004 DEF-03)
    postcondition_load: le fingerprint est vérifié au chargement par verify_table — aucun chargeur en v1.1

# =====================================================================================
# 6. Compatibilité
# =====================================================================================

compatibility:
  classification: MINOR (1.0 → 1.1), additive
  guarantees:
    - aucun champ v1.0 renommé ni supprimé (snapshot_id, fingerprint, as_of, availability_cutoff,
      provenance, instruments, adjustments, quality_flags, storage_hint)
    - tout objet v1.0 valide reste valide et conserve sa valeur de contract_version "1.0"
    - le format du fingerprint n'est pas imposé rétroactivement aux objets sans table_schema
    - "DatasetSnapshotRef (C01, C03) inchangé : {snapshot_id, fingerprint}"
    - DecisionTrace.verify_fingerprint_chain inchangé
    - C01 ContractRef.c02 conserve sa valeur par défaut "1.0" ; un run sur snapshot v1.1 déclare c02 = "1.1"
      explicitement (changer ce défaut modifierait C01)
  migration: aucune requise ; un objet v1.0 peut être ré-émis en v1.1 sans perte
  compatibility_axes:
    json_input: >
      tout JSON v1.0 dont les types scientifiques sont ceux du contrat (booléen JSON, entier JSON,
      instant avec fuseau) est accepté et, pour les instants, stocké en UTC (BC-12). Exception :
      une clé supplémentaire homonyme d'un champ introduit en v1.1 (counts, lineage, …) n'est plus
      ignorée — elle est interprétée comme ce champ (BC-13)
    json_output: >
      la sortie JSON d'un objet v1.0 comporte en plus les clés v1.1 (null / []) — non identique
      octet à octet à la sortie du code v1.0 ; le code v1.0 la relit (clés inconnues ignorées)
    fingerprints: >
      aucune empreinte scientifique (QCT-1 / QCC-1 / QCJ-1 d'identité, raw, lignée, calendrier)
      modifiée par v1.1, CA-01, CA-02, CA-03 ni CA-04 (vecteurs de test et valeurs épinglées). La
      sérialisation JSON d'un snapshot dont les instants étaient stockés avec un fuseau non-UTC
      change d'offset (même instant, forme UTC) — BC-12
    python_api: NON totalement compatible — voir behaviour_changes BC-03 à BC-14
  behaviour_changes:
    BC-01: valeur par défaut de contract_version "1.0" → "1.1" (objet construit sans version explicite)
    BC-02: domaine de contract_version restreint à {"1.0", "1.1"} (valeur libre en v1.0)
    BC-03: >
      sortie d'un objet v1.0 enrichie des 13 clés v1.1 — en JSON (null / []) comme en Python :
      model_dump() contient aussi ces 13 clés (None, ou () pour les champs tuple source_artifacts et
      lineage en mode python ; [] en mode json). Un consommateur comparant model_dump() à un dict v1.0
      littéral n'obtient plus l'égalité
    BC-04: DatasetSnapshot gelé — réaffectation d'attribut rejetée
    BC-05: >
      Provenance et AdjustmentRecord gelés ; instruments, adjustments, quality_flags stockés en tuple
      (model_dump restitue des list) ; conséquence : snapshot.instruments == ["X"] est faux,
      snapshot.instruments == ("X",) est vrai
    BC-06: >
      mappings v1.1 (request_parameters, provenance_metadata, parameters) stockés en FrozenMap
      (isinstance(…, dict) faux) et leurs listes imbriquées en tuple. L'égalité avec un dict n'est
      vraie que si les listes imbriquées sont écrites en tuple : parameters == {"c": ["a"]} est FAUX,
      parameters == {"c": ("a",)} est vrai ; model_dump() restitue des dict/list et reste égal au dict
      d'origine. DataGateAssessment.snapshot_ref stocké en FrozenDatasetSnapshotRef (sous-classe gelée
      de DatasetSnapshotRef : isinstance conservé, égalité pydantic avec une DatasetSnapshotRef fausse)
    BC-07: >
      CRED-1 rejette des entrées v1.1 auparavant acceptées (clés K1, indicateurs V1–V4 à toute
      position). CA-02 : grammaire indépendante de la position ; « Basic Materials », « Token Ring »,
      « bearer bond » et les jetons V2 de moins de 8 caractères ne sont plus signalés (frontière V2)
    BC-08: >
      les modèles C02 gelés sont hachables (sémantique pydantic frozen), de façon cohérente avec
      l'égalité (a == b ⇒ hash(a) == hash(b)) ; la valeur de hachage n'est ni une identité ni stable
      entre processus — les empreintes sha256 sont les seules identités
    BC-09: >
      une instance de modèle C02 passée à une frontière validante est revalidée et stockée comme
      copie (égale, non identique : snapshot.lineage[0] is record est faux) ; une instance forgée
      invalide est rejetée (validation_boundaries)
    BC-10: >
      domaine canonique explicite : heure locale à fraction de seconde non nulle rejetée par QCJ-1 ;
      instant dont la conversion UTC sort de 0001–9999 rejeté ; décimal QCT-1 au-delà de 28 chiffres
      significatifs rejeté par ValueError ; colonnes QCT-1 dupliquées rejetées ; collection d'artefacts
      à identifiants dupliqués rejetée par verify_artifacts
    BC-11: >
      type d'exception : les chemins publics C02 (constructeurs, verify_*, représentations
      canoniques, i01_depth_tier, validate_i01_snapshot) lèvent ValueError ou ValidationError
      plutôt qu'une exception interne (TypeError, KeyError, OverflowError, decimal.InvalidOperation)
      sur une entrée mal formée du domaine. Un instant naïf est rejeté à la frontière UTC
      (timezone-aware) et non plus par comparaison mixte
    BC-12: >
      tout instant validé est converti et stocké en timezone.utc ; un JSON ou un objet Python
      fourni avec un autre offset est accepté (même instant) mais resérialisé en …Z. Aucun tzinfo
      de l'appelant n'est conservé (y compris un tzinfo mutable)
    BC-13: >
      un JSON v1.0 portant une clé supplémentaire homonyme d'un champ v1.1 (counts, instrument,
      lineage, …) n'est plus ignoré : le champ est interprété et doit être valide, ou l'objet
      viole C02-INV-17. Les clés vraiment inconnues restent ignorées
    BC-14: >
      booléens et entiers scientifiques sont stricts (plus de « yes »→True, True→1, 1.0→1),
      y compris lorsqu'ils traversent Knowable[int] / Knowable[bool] (constructeur, .known,
      model_validate, JSON, objets imbriqués, revalidation). Conservé pour l'interop JSON :
      str→datetime/date, str→enum, str→KnowledgeStatus. Les identifiants restent des chaînes.
      Décision CA-03 / CA-04 : strict là où la coercition change le sens (gates, comptages,
      ACK booléen) ; le contrôle porte sur le type brut avant conversion Pydantic ; pas de
      strict modèle-entier (casserait str→datetime)
  behaviour_changes_rationale: >
    BC-04 à BC-06 suppriment des capacités de mutation que la postcondition v1.0 (« snapshot immutable
    after publish ») interdisait déjà : elles corrigent un défaut d'implémentation, pas le contrat.
    Aucun champ, aucune sérialisation d'entrée ni aucune empreinte n'est modifié ; la version reste
    MINOR (1.1). Un consommateur Python comparant ces champs à des list/dict littéraux doit comparer
    des tuples ou convertir. Politique de version inchangée par CA-01. BC-07 à BC-11 (CA-02)
    corrigent des défauts contre des règles déjà normatives.
    BC-12 à BC-14 (CA-03) rendent explicites la frontière UTC, les clés homonymes v1.1 et
    les coercitions scientifiques ; CA-04 rend BC-14 transitif à travers Knowable.
    Aucune empreinte d'identité n'est modifiée. Politique de version inchangée par CA-03
    et CA-04.
  exigences_investigation: >
    Les exigences propres à une investigation sont exprimées par des PROFILS de validation,
    pas par des champs obligatoires du contrat générique.
  v2_candidates: >
    Tout renommage, suppression ou resserrement rétroactif (ex. format obligatoire du fingerprint
    pour tous les objets) relève de C02 v2.0 et ne doit pas être introduit dans v1.x.

