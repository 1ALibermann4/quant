# =====================================================================================
# 7. Errata
# =====================================================================================

errata:
  E-01:
    affects: specs/contracts/C02/C02_v1.0.yaml — preconditions, ligne « availability_cutoff <= as_of is invalid → reject »
    identified_by: research/I01/DATA-REQ-I01.md §7.3 DATA-GAP-02
    nature: erreur de rédaction du texte YAML v1.0 (condition inversée)
    correct_semantics: availability_cutoff <= as_of est REQUIS ; availability_cutoff > as_of est rejeté
    evidence_semantics_unchanged:
      - src/quant/contracts/dataset_snapshot.py rejette availability_cutoff > as_of depuis P0 (a4c55b9)
      - tests/contracts/test_dataset_snapshot.py::test_availability_cutoff_after_as_of_rejected (P0)
      - "C03 : MarketState.as_of <= availability_cutoff — cohérent avec cutoff <= as_of"
      - "DATA-REQ-I01 §9.1 : « availability_cutoff ≤ as_of (C02) »"
    statement: >
      Ce n'est pas une nouvelle sémantique introduite par v1.1 : l'implémentation, les tests et
      les documents dépendants ont toujours appliqué la règle correcte. Le fichier v1.0 publié
      n'est pas réécrit ; il est corrigé par cet erratum.

limitations:
  - aucun chargeur, aucune acquisition, aucune source de calendrier dans ce contrat
  - C02-INV-05 et C02-INV-18 ne couvrent ni les contournements délibérés (object.__setattr__,
    attributs privés ou spéciaux) ni un objet forgé (model_construct, model_copy(update=…)) tant qu'il
    n'a franchi aucune frontière validante ; toute frontière validante le revalide profondément
    (validation_boundaries)
  - C02-INV-14 n'est garanti qu'à la frontière verify_calendar (invariant_enforcement)
  - les objets portant une valeur Knowable ne sont pas sérialisables par pickle (classe générique
    paramétrée pydantic) ; limitation antérieure à CA-01, JSON est la sérialisation de référence
  - close_instant dépend de la base de fuseaux IANA de l'environnement (zoneinfo) ; l'heure
    locale validée n'a pas de fold (fold appartient à l'instant, stocké en UTC)
  - storage_hint reste informatif
  - model_fields_set (Pydantic) reste mutable ; hors état scientifique (C02-INV-05)

